version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: steamdna-postgres
    environment:
      POSTGRES_DB: steamdna
      POSTGRES_USER: steamdna
      POSTGRES_PASSWORD: steamdna_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - steamdna-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U steamdna']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: steamdna-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - steamdna-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: steamdna-backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: steamdna
      DB_PASSWORD: steamdna_password
      DB_DATABASE: steamdna
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    networks:
      - steamdna-network
    command: npm run dev

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: steamdna-frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - steamdna-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  steamdna-network:
    driver: bridge
